<style>
html,body{margin:0;height:100%;overflow:hidden;background:#101b24}canvas{display:block;margin:auto;height:100vh;max-width:100vw;touch-action:none;outline:none}
</style>

<body>
<script>
window.wx={
  // First call is the display canvas; later calls are offscreen, matching WeChat.
  createCanvas(){const c=document.createElement('canvas');if(!window.__mainCanvas){window.__mainCanvas=c;document.body.appendChild(c);}return c;},
  getWindowInfo(){return {windowWidth:Math.min(innerWidth,462),windowHeight:innerHeight,pixelRatio:devicePixelRatio||1};},
  getSystemInfoSync(){return this.getWindowInfo();},
  vibrateShort(){},
  createWebAudioContext(){
    const AudioContextClass=window.AudioContext||window.webkitAudioContext;
    if(!AudioContextClass) throw new Error('WebAudio is not supported');
    return new AudioContextClass();
  },
  onHide(){},
  onShow(){}
};
</script>
<script src="game.js"></script>
</body>
